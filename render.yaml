services:
  - type: web
    name: gb-herbarium
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: GMAIL_USER
        value: gbherbarium@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_RECIPIENT_EMAIL
        value: gbherbarium@gmail.com
    disk:
      name: gb-herbarium-data
      mountPath: /var/data
      sizeGB: 1
